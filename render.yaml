services:
  # NeuroFusion FastAPI Backend Web Service
  - type: web
    name: neurofusion-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 20
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: neurofusion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PROJECT_NAME
        value: "NeuroFusion AI"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: SMS_MODE
        value: development
      - key: SMS_PROVIDER
        value: development
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: ADMIN_EMAIL
        value: "admin@neurofusion.ai"
      - key: ADMIN_PASSWORD
        value: "Admin@12345"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"

databases:
  # Managed PostgreSQL Database
  - name: neurofusion-db
    region: oregon
    plan: free
    databaseName: neurofusion
    user: neurofusion
