services:
  # Database Service (PostgreSQL 16)
  db:
    image: postgres:16-alpine
    container_name: neurofusion_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurofusion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neurofusion_secure_pwd_123}
      POSTGRES_DB: ${POSTGRES_DB:-neurofusion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neurofusion} -d ${POSTGRES_DB:-neurofusion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neurofusion_net

  # Backend API & AI Inference Engine (FastAPI + PyTorch)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neurofusion_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PROJECT_NAME: "NeuroFusion AI"
      SECRET_KEY: ${SECRET_KEY:-neurofusion_secret_key_production_deploy_2026}
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-neurofusion}:${POSTGRES_PASSWORD:-neurofusion_secure_pwd_123}@db:5432/${POSTGRES_DB:-neurofusion}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-neurofusion}:${POSTGRES_PASSWORD:-neurofusion_secure_pwd_123}@db:5432/${POSTGRES_DB:-neurofusion}
      CORS_ORIGINS: '["http://localhost","http://localhost:80","http://localhost:3000","http://localhost:5173","${PRODUCTION_FRONTEND_URL:-http://localhost}"]'
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/auth/google/callback}
      SMS_MODE: ${SMS_MODE:-development}
      SMS_PROVIDER: ${SMS_PROVIDER:-development}
    volumes:
      - uploaded_files:/app/uploads
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - neurofusion_net

  # Frontend Web UI (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: neurofusion_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - neurofusion_net

volumes:
  pgdata:
    driver: local
  uploaded_files:
    driver: local

networks:
  neurofusion_net:
    driver: bridge
